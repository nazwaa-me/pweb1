<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 5</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Formulir Biodata</legend>
            <table>
                <tr>
                    <td><label for="nama">Nama Lengkap</label></td>
                    <td>:</td>
                    <td><input type="text" id="nama" name="nama"></td>
                </tr>
                <tr>
                    <td><label for="tempat_lahir">Tempat Lahir</label></td>
                    <td>:</td>
                    <td><input type="text" id="tempat_lahir" name="tempat_lahir"></td>
                </tr>
                <tr>
                    <td><label for="tanggal_lahir">Tanggal Lahir</label></td>
                    <td>:</td>
                    <td><input type="date" id="tanggal_lahir" name="tanggal_lahir"></td>
                </tr>
                <tr>
                    <td>Jenis Kelamin</td>
                    <td>:</td>
                    <td>
                        <input type="radio" id="laki" name="jenis_kelamin" value="laki-laki">
                        <label for="laki">Laki-laki</label>
                        <input type="radio" id="perempuan" name="jenis_kelamin" value="perempuan">
                        <label for="perempuan">Perempuan</label>
                    </td>
                </tr>
                <tr>
                    <td><label for="alamat">Alamat</label></td>
                    <td>:</td>
                    <td><textarea id="alamat" name="alamat" cols="22" rows="3"></textarea></td>
                </tr>
                <tr>
                    <td><label for="email">E-mail</label></td>
                    <td>:</td>
                    <td><input type="email" id="email" name="email"></td>
                </tr>
                <tr>
                    <td><label for="no_hp">No Hp</label></td>
                    <td>:</td>
                    <td><input type="number" id="no_hp" name="no_hp"></td>
                </tr>
                <tr>
                    <td><label for="kota">Kota</label></td>
                    <td>:</td>
                    <td>
                        <select id="kota" name="kota">
                            <option value="">*****SELECT KOTA*****</option>
                            <option value="Bogor">Bogor</option>
                            <option value="Jakarta">Jakarta</option>
                            <option value="Bekasi">Bekasi</option>
                            <option value="Tangerang">Tangerang</option>
                            <option value="Depok">Depok</option>
                            <option value="Cikarang">Cikarang</option>
                            <option value="Banten">Banten</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>&nbsp;</td>
                    <td>&nbsp;</td>
                    <td>
                        <input type="submit" name="submit" value="Simpan">
                        <input type="reset" name="reset" value="Batal">
                    </td>
                </tr>
            </table>
        </fieldset>
    </form>
</body>
</html>
